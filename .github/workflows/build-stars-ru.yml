name: Build Stars RU localization

on:
  push:
    branches:
      - feat/stars-ru-localization
    paths:
      - 'tools/StarsRuPatcher/**'
      - 'translations/stars-new-skills.ru.json'
      - '.github/workflows/build-stars-ru.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stars-ru-localization

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Patch Russian localization into SML
        run: |
          dotnet run --project tools/StarsRuPatcher/StarsRuPatcher.csproj --configuration Release --             "Stars New Skills All-in-One.sml"             "translations/stars-new-skills.ru.json"             "dist/Stars New Skills All-in-One.sml"

      - name: Build RU starter necromancer variant
        run: |
          dotnet run --project tools/StarsRuPatcher/StarsRuPatcher.csproj --configuration Release --             "Stars New Skills All-in-One.sml"             "translations/stars-new-skills.ru.json"             "dist/Stars New Skills All-in-One - RU Starter Necromancer.sml"             --start-necromancer

      - name: Verify SML header
        shell: python
        run: |
          from pathlib import Path
          for name in [
              "Stars New Skills All-in-One.sml",
              "Stars New Skills All-in-One - RU Starter Necromancer.sml",
          ]:
              p = Path("dist") / name
              data = p.read_bytes()
              assert data[:4] == b"MSLM", (name, data[:4])
              print(name, "size:", len(data))
              print(name, "MSLM header: OK")

      - name: Commit built RU mod
        run: |
          git config user.name "stars-ru-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "dist/Stars New Skills All-in-One.sml" "dist/Stars New Skills All-in-One - RU Starter Necromancer.sml"
          if git diff --cached --quiet; then
            echo "Built mod is unchanged"
            exit 0
          fi
          git commit -m "build: add Russian-localized Stars New Skills SML"
          git push origin HEAD:feat/stars-ru-localization
